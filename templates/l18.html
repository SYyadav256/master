<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body>
    <h1>{{topic}}</h1>
    <h1>Without if</h1>
    {% for n in number %}
    <div>
        hello,{{n}}
    </div>
    {% endfor %}

    <h3>With if</h3>
    {% for n in number %}
    {% if n > 20 %}
    <div>
        {{n}}
    </div>
    {% endif %}
    {% endfor %}
</body>
</html>
